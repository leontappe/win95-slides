server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on; # nginx's default mime.types already maps .wasm to application/wasm
    gzip_types application/javascript application/json application/wasm text/css;

    # disk parts and snapshot never change for a given snapshot; decks are rebuilt in place
    location /disks/   { add_header Cache-Control "public, max-age=604800, immutable"; }
    location /state/   { add_header Cache-Control "no-cache"; }
    location /decks/   { add_header Cache-Control "no-cache"; }
    location = /config.json { add_header Cache-Control "no-cache"; }
}
